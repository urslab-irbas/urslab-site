# Проверка при всяко предложение за промяна: сайтът трябва да се изгражда без грешки.
name: Build check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Данните от клона data (публикациите от формата)
        run: |
          if git fetch -q origin data; then git checkout FETCH_HEAD -- src/data/contrib.json; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: urslab-dist
          path: dist/
          include-hidden-files: true
          retention-days: 30
