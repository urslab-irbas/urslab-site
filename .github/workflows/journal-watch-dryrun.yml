# ВРЕМЕННА ПРОБА (маха се преди сливането): наблюдението на списанията на БАН без запис в клона data.
name: Проба — наблюдение на списания на БАН
on:
  pull_request:
    paths: ['scripts/journal-watch*.mjs', 'scripts/journal-watch-sources.json', '.github/workflows/journal-watch-dryrun.yml']
permissions:
  contents: write
jobs:
  dryrun:
    if: github.head_ref == 'journal-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: journal-watch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          git fetch -q origin data && git checkout FETCH_HEAD -- src/data/contrib.json && (git checkout FETCH_HEAD -- src/data/citations || true)
          npm ci && npm run build
          git checkout HEAD -- src/data/contrib.json src/data/citations
      - run: node scripts/journal-watch-dryrun.mjs
        env:
          JW_SINCE: '2026-09-01'
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "Проба: наблюдение на списания [skip ci]" && git push -q origin HEAD:journal-watch || true
