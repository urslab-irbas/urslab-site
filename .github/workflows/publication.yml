# Нова публикация от формата на сайта (/publications/new/).
# Формата отваря заявка (Issue) „[Публикация] …“ с данните в JSON блок. Тук:
#   1) scripts/add-publication.mjs проверява автора на заявката (GitHub акаунт от src/data/team/*.ts)
#      и записа (същите правила като във формата) и го добавя в src/data/contrib.json;
#   2) сайтът се изгражда за проверка;
#   3) създава се клон publication/issue-N и Pull Request към main, който ръководителят одобрява (Merge);
#   4) в заявката се пише резултатът: ✅ с връзка към PR или ❌ с грешките и връзка за поправка.
# Необходима настройка (веднъж): Settings → Actions → General → Workflow permissions →
#   „Read and write permissions“ + „Allow GitHub Actions to create and approve pull requests“.
name: Нова публикация (от формата на сайта)
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: publication-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  add:
    if: startsWith(github.event.issue.title, '[Публикация]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверка на заявката и записа
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADMIN_LOGIN: ${{ github.repository_owner }}
        run: node scripts/add-publication.mjs

      - name: Изграждане на сайта с новата публикация
        id: build
        if: steps.check.outputs.ok == 'true'
        run: npm ci && npm run build

      - name: Клон и Pull Request
        id: pr
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          TITLE=$(node -p "require('./pub-result.json').title")
          B="publication/issue-$NUM"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$B"
          git add src/data/contrib.json
          git commit -m "Нова публикация от заявка #$NUM (@$AUTHOR): $TITLE"
          git push -f origin "$B"
          PR=$(gh pr list --head "$B" --state open --json url -q '.[0].url')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --base main --head "$B" --title "Нова публикация: $TITLE" \
              --body "Въведена през формата на сайта от @$AUTHOR. Проверката и изграждането на сайта са успешни.

          След **Merge** сайтът се обновява сам. Closes #$NUM" ) || PR=""
          fi
          echo "url=$PR" >> "$GITHUB_OUTPUT"
          echo "compare=https://github.com/${{ github.repository }}/compare/main...$B?expand=1" >> "$GITHUB_OUTPUT"

      - name: Отговор в заявката
        if: always() && steps.check.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          COMPARE_URL: ${{ steps.pr.outputs.compare }}
          BUILD: ${{ steps.build.outcome }}
        with:
          script: |
            const r = require('./pub-result.json');
            const num = context.issue.number;
            const { owner, repo } = context.repo;
            let text, close = false, label;
            if (!r.authorized) {
              text = `❌ **Заявката не е приета.**\n\n${r.errors.join('\n')}\n\nПубликации въвеждат само членовете на колектива със своя GitHub акаунт.`;
              close = true; label = 'отказана';
            } else if (!r.ok) {
              text = `❌ **Има грешки — записът не е приет.**\n\n${r.errors.map((e) => '- ' + e).join('\n')}\n\n` +
                `👉 **[Поправете във формата на сайта](${r.fixUrl})** — данните са попълнени; коригирайте и натиснете „Запиши“ отново. Тази заявка се затваря.`;
              close = true; label = 'грешка';
            } else if (process.env.BUILD !== 'success') {
              text = `❌ Записът е правилен, но сайтът не се изгради с него. Ръководителят ще прегледа проблема.`;
              label = 'грешка';
            } else {
              const pr = process.env.PR_URL;
              text = `✅ **Записът е приет.**\n\n> ${r.apa}\n\n` + (pr
                ? `Pull Request: ${pr}\n\nСлед одобрение (Merge) от ръководителя публикацията ще се появи на сайта до около минута.`
                : `Клонът е готов, но GitHub не позволи автоматичен Pull Request. Ръководителят: отворете ${process.env.COMPARE_URL} и натиснете „Create pull request“.`);
              label = 'приета';
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: num, body: text });
            try { await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: ['публикация', label] }); } catch (e) { core.warning(e.message); }
            if (close) await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: 'not_planned' });
