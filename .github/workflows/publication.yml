# Нова публикация от формата на сайта (/publications/new/) — напълно автоматично, без ръчно одобрение.
# Формата отваря заявка (Issue) „[Публикация] …“ с данните в JSON блок. Тук:
#   1) scripts/add-publication.mjs проверява автора на заявката (GitHub акаунт от src/data/team/*.ts),
#      правилата на формата (src/lib/pubSchema.js) и DOI / ISSN / ISBN в публичните регистри
#      (scripts/verify-ids.mjs: doi.org, Crossref, DataCite, НАЦИД НРС, ISSN Portal, Open Library);
#      ако нещо не може да се провери — записът се отказва;
#   2) сайтът се изгражда за проверка;
#   3) записът (src/data/contrib.json) и редът в дневника (publish-log.md) се записват в клона `data`
#      (не е защитен — личните хранилища не позволяват GitHub Actions да заобикаля правилата на main)
#      и се пуска качването на сайта (deploy.yml изгражда main + данните от data);
#   4) в заявката се пише резултатът. При успех ръководителят (@собственикът на хранилището) получава уведомление,
#      а коментарът съдържа отметка „Върни“ — едно щракване премахва публикацията (revert-publication.yml).
name: Нова публикация (от формата на сайта)
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: publication-main
  cancel-in-progress: false
jobs:
  add:
    if: startsWith(github.event.issue.title, '[Публикация]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Данните от клона data (публикациите от формата и дневникът)
        run: |
          git fetch -q origin data
          git checkout FETCH_HEAD -- src/data/contrib.json publish-log.md

      - name: Проверка на заявката, записа и идентификаторите в регистрите
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADMIN_LOGIN: ${{ github.repository_owner }}
        run: node scripts/add-publication.mjs

      - name: Изграждане на сайта с новата публикация
        id: build
        if: steps.check.outputs.ok == 'true'
        run: npm ci && npm run build

      - name: Запис в клона data и качване на сайта
        id: publish
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          TITLE=$(node -p "require('./pub-result.json').title")
          cp src/data/contrib.json publish-log.md "$RUNNER_TEMP/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin data
          git worktree add -q "$RUNNER_TEMP/data" FETCH_HEAD
          cd "$RUNNER_TEMP/data"
          cp "$RUNNER_TEMP/contrib.json" src/data/contrib.json
          cp "$RUNNER_TEMP/publish-log.md" publish-log.md
          git add src/data/contrib.json publish-log.md
          git commit -m "Публикувана от заявка #$NUM (@$AUTHOR): $TITLE"
          ok=0; for i in 1 2 3; do
            if git push origin HEAD:data; then ok=1; break; fi
            sleep 5; git pull --rebase origin data
          done
          [ "$ok" = 1 ] || { echo "::error::Записът в клона data не успя"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          gh workflow run deploy.yml --ref main

      - name: Отговор в заявката
        if: always() && steps.check.outcome == 'success'
        uses: actions/github-script@v7
        env:
          BUILD: ${{ steps.build.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          SHA: ${{ steps.publish.outputs.sha }}
        with:
          script: |
            const r = require('./pub-result.json');
            const num = context.issue.number;
            const { owner, repo } = context.repo;
            let text, close = false, label, reason = 'not_planned';
            if (!r.authorized) {
              text = `❌ **Заявката не е приета.**\n\n${r.errors.join('\n')}\n\nПубликации въвеждат само членовете на колектива със своя GitHub акаунт.`;
              close = true; label = 'отказана';
            } else if (!r.ok) {
              const who = context.payload.issue.user.login;
              text = `@${who}, ❌ **записът не е приет** — нищо не е публикувано. Какво да направите:\n\n` +
                `**1. Какво не е наред**\n${r.errors.map((e) => '- ' + e).join('\n')}\n\n` +
                `**2. Как да го поправите**\n${(r.howto || []).map((e, i) => `${i + 1}. ${e}`).join('\n')}\n\n` +
                `**3. Изпратете отново:** отворете 👉 **[Поправете във формата на сайта](${r.fixUrl})** (данните са попълнени), поправете, натиснете „Запиши“ и после „Create“ в GitHub.\n\n` +
                `Ако нещо не е ясно, отговорете с коментар в тази заявка — ръководителят получава уведомление. Тази заявка се затваря.`;
              close = true; label = 'отказана';
            } else if (process.env.BUILD !== 'success' || process.env.PUBLISH !== 'success') {
              text = `❌ Записът е проверен, но сайтът не се изгради или не се записа. @${owner}: вижте ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              label = 'грешка';
            } else {
              text = `<!-- revert-pub -->\n✅ **Публикувано на сайта** (до около минута; обновете с Ctrl+F5).\n\n> ${r.apa}\n\n` +
                `**Проверено в регистрите:**\n${r.verified.map((v) => '- ' + v).join('\n')}\n\n` +
                `Запис: ${process.env.SHA?.slice(0, 7)} · дневник: [publish-log.md](${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/blob/data/publish-log.md)\n\n` +
                `@${owner} — уведомление за нова публикация. Ако трябва да се премахне от сайта, отметнете:\n\n` +
                `- [ ] **Върни** — премахни тази публикация от сайта`;
              close = true; label = 'публикувана'; reason = 'completed';
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: num, body: text });
            try { await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: ['публикация', label] }); } catch (e) { core.warning(e.message); }
            if (close) await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: reason });
