name: Temporary check (zahariev)
on: { push: { branches: [linkcheck-tmp] } }
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd tools && node zah.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          cp tools/zah.json zah.json; git add zah.json; git commit -m "zah [skip ci]"; git push
