# Б4 (задача #121): „Точки НАЦИД“ и стратегия — по имейл само на потребителя и на ръководителя.
# Бутонът „Таблица по имейл“ в „Обобщен отчет“ отваря заявка „[Точки НАЦИД] <име>“ с ред „Потребител: <id>“ (приема се и старият „Член: <id>“).
# Приема се само от GitHub акаунта на самия потребител или на ръководителя (собственика на хранилището); иначе — отказ.
# В заявката не се пишат числа: таблицата е само в приложения към писмото PDF (справка за всички потребители). Нищо не се записва и не се качва като артефакт.
# Дневникът на изпълнението е публичен: адресите се маскират, темата на писмото е неутрална (без недостиг / резултат).
# Получатели: имейлът на потребителя (поле email в профила или тайната MEMBER_EMAILS: „id=адрес; id=адрес“) + ръководителят.
name: Точки НАЦИД по имейл
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: nacid-table
  cancel-in-progress: false
jobs:
  mail:
    if: startsWith(github.event.issue.title, '[Точки НАЦИД]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIL_READY: ${{ secrets.MAIL_SERVER != '' && secrets.MAIL_FROM != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Право (самият потребител или ръководителят) и получатели
        id: gate
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
          OWNER: ${{ github.repository_owner }}
          MEMBER_EMAILS: ${{ secrets.MEMBER_EMAILS }}
        run: |
          node -e '
            const fs = require("fs");
            const who = (process.env.AUTHOR || "").toLowerCase(), owner = process.env.OWNER.toLowerCase();
            const team = fs.readdirSync("src/data/team").filter((f) => f.endsWith(".ts") && !["index.ts", "types.ts"].includes(f)).map((f) => {
              const s = fs.readFileSync("src/data/team/" + f, "utf8"); const g = (k) => (s.match(new RegExp(k + ":\\s*\x27([^\x27]+)\x27")) || [])[1] || "";
              return { id: g("id"), github: g("github").toLowerCase(), email: g("email") };
            }).filter((m) => m.id);
            const id = ((process.env.BODY || "").match(/^\s*(?:Потребител|Член):\s*([a-z0-9-]+)/im) || [])[1] || "";
            const m = team.find((x) => x.id === id);
            let ok = true, why = "";
            if (!m) { ok = false; why = "Не е посочен потребител (ред „Потребител: …“). Отворете заявката от бутона „Таблица по имейл“ в „Обобщен отчет“."; }
            else if (who !== owner && m.github !== who) { ok = false; why = "Таблицата се изпраща само по заявка на самия потребител (от неговия GitHub акаунт) или на ръководителя."; }
            const extra = Object.fromEntries(String(process.env.MEMBER_EMAILS || "").split(/[;\n]+/).map((x) => x.split("=").map((y) => y.trim())).filter((x) => x[0] && /@/.test(x[1] || "")));
            const head = team.find((x) => x.github === owner) || team.find((x) => x.id === "madzharov");
            const memberMail = m ? (m.email || extra[m.id] || "") : "";
            const to = [...new Set([memberMail, head && head.email].filter(Boolean))].join(",");
            // адресите не се показват в публичния дневник на изпълнението
            for (const x of to.split(",").filter(Boolean)) console.log("::add-mask::" + x);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ok=${ok}\nwhy=${why}\nid=${id}\nto=${to}\nmemberMail=${memberMail ? "yes" : "no"}\n`);
          '
      - name: Отказ
        if: steps.gate.outputs.ok != 'true'
        uses: actions/github-script@v7
        env:
          WHY: ${{ steps.gate.outputs.why }}
        with:
          script: |
            const { owner, repo } = context.repo; const num = context.issue.number;
            await github.rest.issues.createComment({ owner, repo, issue_number: num, body: `ℹ️ ${process.env.WHY}` });
            await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: 'not_planned' });
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Данните от клона data (публикации и цитирания от формата, кандидатите от търсенето)
        if: steps.gate.outputs.ok == 'true'
        run: |
          git fetch -q origin data
          git checkout FETCH_HEAD -- src/data/contrib.json
          git checkout FETCH_HEAD -- src/data/citations 2>/dev/null || true
          git checkout FETCH_HEAD -- citation-scan/candidates.json 2>/dev/null || true
          npm ci
      - name: Таблица и стратегия
        id: calc
        if: steps.gate.outputs.ok == 'true'
        run: |
          npx tsx scripts/nacid-mail.ts "${{ steps.gate.outputs.id }}" > /dev/null
          node -e 'const j=require("./nacid-mail.json"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `subject=${j.subject}\npdf=${j.pdf}\n`)'
      - name: Справката в PDF
        id: pdf
        if: steps.calc.outcome == 'success'
        env:
          PDF: ${{ steps.calc.outputs.pdf }}
        run: |
          CH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CH" --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf-no-header --print-to-pdf="$PDF" "file://$PWD/nacid-report.html" 2>/dev/null
          test -s "$PDF" && echo "PDF: $(stat -c %s "$PDF") байта"
      - name: Имейл
        id: mail
        if: steps.pdf.outcome == 'success' && steps.gate.outputs.to != '' && env.MAIL_READY == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ steps.gate.outputs.to }}
          subject: ${{ steps.calc.outputs.subject }}
          html_body: file://nacid-mail.html
          attachments: ${{ steps.calc.outputs.pdf }}
          convert_markdown: false
      - name: Отговор в заявката (без числа)
        if: always() && steps.gate.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          SENT: ${{ steps.mail.outcome }}
          MEMBER_MAIL: ${{ steps.gate.outputs.memberMail }}
        with:
          script: |
            const { owner, repo } = context.repo; const num = context.issue.number;
            const ok = process.env.SENT === 'success';
            const body = ok
              ? `✉️ Таблицата „Точки НАЦИД“ и стратегията са изпратени по имейл ${process.env.MEMBER_MAIL === 'yes' ? 'на потребителя и на ръководителя' : 'на ръководителя (за потребителя няма имейл в Системата)'}.`
              : process.env.MAIL_READY !== 'true'
                ? '⚠️ Писмото не беше изпратено: пощата на Системата още не е настроена (тайните MAIL_SERVER, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM). Ръководителят ще я настрои.'
                : '⚠️ Писмото не беше изпратено — ръководителят ще провери настройките на пощата.';
            // при успех — без коментар (без второ писмо): отбелязва се в текста на заявката; коментар — само при проблем
            if (ok) {
              const cur = (await github.rest.issues.get({ owner, repo, issue_number: num })).data.body ?? '';
              await github.rest.issues.update({ owner, repo, issue_number: num, body: `${cur}\n\n---\n${body}` });
            } else await github.rest.issues.createComment({ owner, repo, issue_number: num, body });
            await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: ok ? 'completed' : 'not_planned' });
