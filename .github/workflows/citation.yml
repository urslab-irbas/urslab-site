# Ново цитиране от формата на сайта (/publications/new/?cite=… — бутонът „+ Цитиране“ в „Обобщен отчет“) — автоматично.
# Формата отваря заявка (Issue) „[Цитиране] …“ с данните в JSON блок. Тук:
#   1) сайтът се изгражда с данните от клона data (за да има актуален /publications/citables.json);
#   2) scripts/add-citation.mjs проверява автора на заявката (членът, чийто е трудът, или ръководителят),
#      цитирания труд, правилата за нова публикация и правилата на НАЦИД за цитиранията (src/lib/pubSchema.js)
#      и DOI / ISSN / ISBN на цитиращия труд в публичните регистри (scripts/verify-ids.mjs);
#   3) сайтът се изгражда отново с новото цитиране;
#   4) src/data/citations/<член>/contrib.json и publish-log.md се записват в клона `data` и сайтът се качва;
#   5) в заявката се пише резултатът; при успех ръководителят получава уведомление и отметка „Върни“ (revert-citation.yml).
name: Ново цитиране (от формата на сайта)
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: publication-main
  cancel-in-progress: false
jobs:
  add:
    if: startsWith(github.event.issue.title, '[Цитиране]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Данните от клона data (публикациите и цитиранията от формата, дневникът)
        run: |
          git fetch -q origin data
          git checkout FETCH_HEAD -- src/data/contrib.json publish-log.md
          git checkout FETCH_HEAD -- src/data/citations 2>/dev/null || echo "Още няма цитирания от формата"
      - name: Изграждане на сайта (актуален списък на трудовете и цитиранията)
        run: npm ci && npm run build

      - name: Проверка на заявката, цитирането и идентификаторите в регистрите
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADMIN_LOGIN: ${{ github.repository_owner }}
        run: node scripts/add-citation.mjs

      - name: Изграждане на сайта с новото цитиране
        id: build
        if: steps.check.outputs.ok == 'true'
        run: npm run build

      - name: Запис в клона data и качване на сайта
        id: publish
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MEMBER: ${{ steps.check.outputs.member }}
        run: |
          TITLE=$(node -p "require('./pub-result.json').title")
          F="src/data/citations/$MEMBER/contrib.json"
          cp "$F" "$RUNNER_TEMP/cit.json"; cp publish-log.md "$RUNNER_TEMP/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin data
          git worktree add -q "$RUNNER_TEMP/data" FETCH_HEAD
          cd "$RUNNER_TEMP/data"
          mkdir -p "src/data/citations/$MEMBER"
          cp "$RUNNER_TEMP/cit.json" "$F"
          cp "$RUNNER_TEMP/publish-log.md" publish-log.md
          git add "$F" publish-log.md
          git commit -m "Цитиране от заявка #$NUM (@$AUTHOR): $TITLE"
          ok=0; for i in 1 2 3; do
            if git push origin HEAD:data; then ok=1; break; fi
            sleep 5; git pull --rebase origin data
          done
          [ "$ok" = 1 ] || { echo "::error::Записът в клона data не успя"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          gh workflow run deploy.yml --ref main

      - name: Отговор в заявката
        if: always() && steps.check.outcome == 'success'
        uses: actions/github-script@v7
        env:
          BUILD: ${{ steps.build.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          SHA: ${{ steps.publish.outputs.sha }}
        with:
          script: |
            const r = require('./pub-result.json');
            const num = context.issue.number;
            const { owner, repo } = context.repo;
            let text, close = false, label, reason = 'not_planned';
            if (!r.authorized) {
              text = `❌ **Заявката не е приета.**\n\n${r.errors.join('\n')}`;
              close = true; label = 'отказана';
            } else if (!r.ok) {
              const who = context.payload.issue.user.login;
              text = `@${who}, ❌ **цитирането не е прието** — нищо не е добавено. Какво да направите:\n\n` +
                `**1. Какво не е наред**\n${r.errors.map((e) => '- ' + e).join('\n')}\n\n` +
                `**2. Как да го поправите**\n${(r.howto || []).map((e, i) => `${i + 1}. ${e}`).join('\n')}\n\n` +
                `**3. Изпратете отново:** отворете 👉 **[Поправете във формата на сайта](${r.fixUrl})** (данните са попълнени), поправете, натиснете „Запиши“ и после „Create“ в GitHub.\n\n` +
                `Ако нещо не е ясно, отговорете с коментар в тази заявка — ръководителят получава уведомление. Тази заявка се затваря.`;
              close = true; label = 'отказана';
            } else if (process.env.BUILD !== 'success' || process.env.PUBLISH !== 'success') {
              text = `❌ Цитирането е проверено, но сайтът не се изгради или не се записа. @${owner}: вижте ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              label = 'грешка';
            } else {
              text = `<!-- revert-cit -->\n✅ **Цитирането е добавено в „Обобщен отчет“** (до около минута; обновете с Ctrl+F5).\n\n> ${r.apa}\n\n` +
                `**Проверено в регистрите:**\n${r.verified.map((v) => '- ' + v).join('\n')}\n\n` +
                `Запис: ${process.env.SHA?.slice(0, 7)} · дневник: [publish-log.md](${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/blob/data/publish-log.md)\n\n` +
                `@${owner} — уведомление за ново цитиране. Ако трябва да се премахне, отметнете:\n\n` +
                `- [ ] **Върни** — премахни това цитиране от сайта`;
              close = true; label = 'публикувана'; reason = 'completed';
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: num, body: text });
            try { await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: ['цитиране', label] }); } catch (e) { core.warning(e.message); }
            if (close) await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: reason });
